<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#3d35f5">
  <title>Faça seu pedido</title>
  <meta name="description" content="Escolha, monte seu pedido e envie pelo WhatsApp.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:"Bricolage Grotesque";src:url(bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
    @font-face{font-family:Manrope;src:url(manrope.woff2) format("woff2");font-weight:200 800;font-display:swap}
    :root{
      --brand:61 53 245; --brand-contrast:255 255 255; --ink:27 26 61; --bg:250 250 253; --surface:255 255 255;
      --sunken:243 242 250; --line:231 229 243; --muted:98 96 132; --ok:22 135 89; --mint:189 239 217; --bad:205 43 49;
      --blush:255 207 194; --accent:226 223 255;
      --raio:1.25rem; --max:42rem;
      --display:"Bricolage Grotesque",system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
    body{margin:0;background:rgb(var(--bg));color:rgb(var(--ink));font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
    body.travado{overflow:hidden}
    button,input,textarea,select{font:inherit;color:inherit}
    button{cursor:pointer;background:none;border:0;padding:0}
    a{color:inherit}
    svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .pagina{max-width:var(--max);margin:0 auto;background:rgb(var(--bg));min-height:100vh;padding-bottom:7rem}

    /* ---------- Capa + identidade ---------- */
    header{position:relative}
    .capa{position:relative;height:12rem;border-radius:0 0 1.5rem 1.5rem;overflow:hidden;background:
      radial-gradient(60% 90% at 85% 10%,rgb(var(--brand)/.9),transparent 70%),
      radial-gradient(50% 80% at 10% 100%,rgb(var(--blush)/.55),transparent 70%),
      rgb(var(--ink))}
    .capa::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgb(255 255 255/.12) 1px,transparent 1px);background-size:14px 14px}
    .capa-texto{position:absolute;right:1.25rem;top:1rem;max-width:58%;overflow-wrap:anywhere;z-index:1;color:#fff;font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:.9;letter-spacing:-.03em;text-align:right;opacity:.92}
    .capa-texto small{display:block;font-size:.8rem;letter-spacing:.2em;font-weight:600;opacity:.75;margin-top:.35rem}
    .status{position:absolute;left:1rem;top:1rem;z-index:2;background:#fff;border-radius:.6rem;padding:.35rem .7rem;box-shadow:0 4px 14px -6px rgb(0 0 0/.35);line-height:1.15}
    .status b{display:flex;align-items:center;gap:.4rem;font-size:.95rem}
    .status b::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:rgb(var(--ok));box-shadow:0 0 0 3px rgb(var(--mint))}
    .status.fechado b::before{background:rgb(var(--bad));box-shadow:0 0 0 3px rgb(var(--bad)/.2)}
    .status span{font-size:.75rem;color:rgb(var(--muted))}
    .logo{position:relative;z-index:3;width:5.5rem;height:5.5rem;margin:-3.4rem auto 0;border-radius:1rem;border:3px solid #fff;background:rgb(var(--brand));color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -10px rgb(var(--ink)/.5);font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:-.04em}
    .identidade{text-align:center;padding:0 1rem}
    .identidade h1{margin:.85rem 0 .3rem;font-family:var(--display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em}
    .endereco{display:flex;align-items:center;justify-content:center;gap:.35rem;color:rgb(var(--muted));font-size:.9rem;max-width:100%}
    .endereco span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .btn-info{margin:1rem auto 0;display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:2.6rem;border:1px solid rgb(var(--line));background:rgb(var(--sunken));border-radius:.8rem;font-weight:600}
    .btn-info:hover{background:rgb(var(--accent)/.6)}

    /* ---------- Barra fixa: busca, menu, abas ---------- */
    .barra{position:sticky;top:0;z-index:20;background:rgb(var(--bg)/.96);backdrop-filter:blur(10px);margin-top:1.4rem;padding:.6rem 1rem 0;border-bottom:1px solid transparent;transition:border-color .2s}
    .barra.colada{border-bottom-color:rgb(var(--line));box-shadow:0 8px 16px -14px rgb(var(--ink)/.4)}
    .barra-linha{display:flex;align-items:center;gap:.5rem}
    .icone-btn{flex:none;display:grid;place-items:center;width:2.4rem;height:2.4rem;border:1px solid rgb(var(--line));border-radius:.75rem;background:rgb(var(--surface))}
    .icone-btn:hover{border-color:rgb(var(--brand)/.5)}
    .abas{display:flex;gap:1.4rem;overflow-x:auto;scrollbar-width:none;padding:0 .4rem;margin-left:.2rem;border-left:1px solid rgb(var(--line))}
    .abas::-webkit-scrollbar{display:none}
    .aba{flex:none;text-decoration:none;padding:.65rem 0;font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.02em;border-bottom:3px solid transparent;white-space:nowrap}
    .aba[aria-current="true"]{color:rgb(var(--brand));border-bottom-color:rgb(var(--brand))}
    .busca{display:none;align-items:center;gap:.5rem;margin:.1rem 0 .6rem;padding:0 .8rem;min-height:2.6rem;border:1px solid rgb(var(--brand)/.5);border-radius:.8rem;background:rgb(var(--surface))}
    .busca.aberta{display:flex}
    .busca input{flex:1;border:0;outline:0;background:none;min-width:0}

    /* ---------- Lista de produtos ---------- */
    .categoria{padding:1.4rem 1rem .2rem;scroll-margin-top:4.5rem}
    .categoria h2{margin:0 0 .4rem;font-family:var(--display);font-weight:800;font-size:1.3rem;text-transform:uppercase;letter-spacing:-.01em}
    .item{position:relative;display:flex;gap:1rem;width:100%;text-align:left;padding:1rem 0;border-bottom:1px solid rgb(var(--line))}
    .item:last-child{border-bottom:0}
    .item-txt{flex:1;min-width:0;display:flex;flex-direction:column}
    .item-nome{font-weight:600;font-size:1rem;text-transform:uppercase}
    .item-desc{margin-top:.25rem;color:rgb(var(--muted));font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .preco{margin-top:.5rem;font-weight:800;font-size:1rem}
    .preco s{margin-left:.4rem;font-weight:500;color:rgb(var(--muted));font-size:.85rem}
    .selo{align-self:flex-start;margin-top:.45rem;font-size:.7rem;font-weight:800;padding:.15rem .5rem;border-radius:99px;background:rgb(var(--blush));color:rgb(120 50 40)}
    .foto{position:relative;flex:none;width:8.5rem;height:8.5rem;border-radius:.9rem;overflow:hidden;background:rgb(var(--sunken))}
    .foto svg{width:100%;height:100%;display:block}
    .mais{position:absolute;right:.4rem;bottom:.4rem;display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:.6rem;background:rgb(var(--brand));color:#fff;box-shadow:0 6px 14px -6px rgb(var(--brand))}
    .item.sem-foto{min-height:7rem}
    .item.sem-foto .mais{right:0;bottom:1rem}
    .item .qtd-chip{position:absolute;left:-.4rem;top:1rem;background:rgb(var(--brand));color:#fff;font-size:.7rem;font-weight:800;border-radius:99px;padding:.05rem .45rem}
    .item:hover .item-nome{color:rgb(var(--brand))}
    .vazio{padding:3rem 1rem;text-align:center;color:rgb(var(--muted))}

    /* ---------- Rodapé ---------- */
    .rodape{padding:2.5rem 1rem 1rem;text-align:center;font-size:.85rem;color:rgb(var(--muted))}
    .rodape a{font-weight:700;color:rgb(var(--brand));text-decoration:none}
    .rodape p{margin:.4rem 0}

    /* ---------- Barra do carrinho ---------- */
    .sacola-barra{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom));pointer-events:none;transform:translateY(120%);transition:transform .25s}
    .sacola-barra.visivel{transform:none}
    .sacola-barra button{pointer-events:auto;max-width:calc(var(--max) - 2rem);margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:3.4rem;padding:0 1.1rem;border-radius:1rem;background:rgb(var(--brand));color:#fff;font-weight:800;box-shadow:0 14px 30px -12px rgb(var(--brand)/.9)}
    .contador{display:grid;place-items:center;min-width:1.7rem;height:1.7rem;border-radius:.5rem;background:rgb(255 255 255/.2);font-size:.85rem}

    /* ---------- Folhas (modal de baixo) ---------- */
    .fundo{position:fixed;inset:0;z-index:40;background:rgb(var(--ink)/.55);opacity:0;pointer-events:none;transition:opacity .2s}
    .fundo.aberto{opacity:1;pointer-events:auto}
    .folha{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:var(--max);margin:0 auto;max-height:92vh;display:flex;flex-direction:column;background:rgb(var(--surface));border-radius:1.4rem 1.4rem 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 40px -20px rgb(0 0 0/.4)}
    .folha.aberta{transform:none}
    .folha[hidden]{display:none}
    @media (min-width:700px){.folha{bottom:auto;top:50%;border-radius:1.4rem;max-height:86vh;transform:translateY(-40%) scale(.97);opacity:0;pointer-events:none;transition:.22s}.folha.aberta{transform:translateY(-50%);opacity:1;pointer-events:auto}}
    .folha-topo{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.1rem;border-bottom:1px solid rgb(var(--line))}
    .folha-topo h3{margin:0;font-family:var(--display);font-size:1.2rem}
    .folha-corpo{overflow-y:auto;padding:1.1rem;flex:1}
    .folha-pe{padding:.9rem 1.1rem calc(.9rem + env(safe-area-inset-bottom));border-top:1px solid rgb(var(--line))}
    .fechar{display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:50%;background:rgb(var(--sunken))}
    .produto-foto{margin:-1.1rem -1.1rem 1rem;height:13rem;background:#ece9fb}
    .produto-foto svg{width:100%;height:100%;display:block}
    .produto-nome{margin:0;font-family:var(--display);font-size:1.4rem;font-weight:800}
    .produto-desc{color:rgb(var(--muted));margin:.4rem 0 0}
    .bloco{margin-top:1.2rem}
    .bloco-titulo{display:flex;justify-content:space-between;align-items:center;margin:0 -1.1rem .6rem;padding:.6rem 1.1rem;background:rgb(var(--sunken));font-weight:800;font-size:.9rem}
    .bloco-titulo em{font-style:normal;font-size:.7rem;padding:.15rem .5rem;border-radius:99px;background:rgb(var(--ink));color:#fff}
    .opcao{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid rgb(var(--line));cursor:pointer}
    .opcao input{width:1.2rem;height:1.2rem;accent-color:rgb(var(--brand))}
    .opcao small{color:rgb(var(--muted))}
    textarea,.campo{width:100%;border:1px solid rgb(var(--line));border-radius:.8rem;padding:.7rem .8rem;background:rgb(var(--bg));outline:0;resize:vertical}
    textarea:focus,.campo:focus{border-color:rgb(var(--brand))}
    .rotulo{display:block;font-weight:700;font-size:.85rem;margin:1rem 0 .35rem}
    .linha-acao{display:flex;gap:.75rem;align-items:center}
    .passo{position:relative;display:flex;align-items:center;border:1px solid rgb(var(--line));border-radius:.8rem;flex:none}
    .passo button{width:2.6rem;height:2.9rem;display:grid;place-items:center;color:rgb(var(--brand))}
    .passo button:disabled{color:rgb(var(--muted)/.5);cursor:default}
    .passo output{min-width:1.8rem;text-align:center;font-weight:800}
    .btn{display:inline-flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:2.9rem;padding:0 1.1rem;border-radius:.875rem;font-weight:800;flex:1}
    .btn-primary{background:rgb(var(--brand));color:#fff}
    .btn-primary:hover{filter:brightness(1.08)}
    .btn-wa{background:#1fae54;color:#fff;justify-content:center;width:100%}
    .btn-primary:disabled,.btn-wa:disabled{opacity:.5;cursor:not-allowed}
    .linha-sacola{display:flex;gap:.8rem;padding:.8rem 0;border-bottom:1px solid rgb(var(--line))}
    .linha-sacola .mini{width:3.5rem;height:3.5rem;border-radius:.6rem;overflow:hidden;flex:none;background:rgb(var(--sunken))}
    .linha-sacola .mini svg{width:100%;height:100%;display:block}
    .linha-sacola .txt{flex:1;min-width:0}
    .linha-sacola .txt b{display:block;font-size:.9rem}
    .linha-sacola .txt small{display:block;color:rgb(var(--muted));font-size:.78rem}
    .linha-sacola .passo button{width:2rem;height:2rem}
    .totais{margin-top:1rem;display:grid;gap:.35rem;font-size:.9rem}
    .totais div{display:flex;justify-content:space-between}
    .totais .total{font-weight:800;font-size:1.1rem;padding-top:.5rem;border-top:1px dashed rgb(var(--line))}
    .segmento{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;padding:.3rem;border-radius:.9rem;background:rgb(var(--sunken))}
    .segmento label{display:block}
    .segmento input{position:absolute;opacity:0}
    .segmento span{display:block;text-align:center;padding:.55rem;border-radius:.65rem;font-weight:700;font-size:.9rem;cursor:pointer}
    .segmento input:checked+span{background:rgb(var(--surface));color:rgb(var(--brand));box-shadow:0 2px 8px -4px rgb(var(--ink)/.35)}
    .segmento input:focus-visible+span{outline:2px solid rgb(var(--brand))}
    .aviso{margin-top:1rem;font-size:.75rem;color:rgb(var(--muted));display:flex;gap:.45rem}
    .info-lista{display:grid;gap:1rem}
    .info-lista div{display:flex;gap:.75rem}
    .info-lista svg{color:rgb(var(--brand));margin-top:.15rem}
    .horarios{width:100%;border-collapse:collapse;font-size:.9rem}
    .horarios td{padding:.35rem 0;border-bottom:1px solid rgb(var(--line))}
    .horarios td:last-child{text-align:right}
    .horarios tr.hoje{font-weight:800;color:rgb(var(--brand))}
    .menu-cat button{display:flex;justify-content:space-between;width:100%;padding:.9rem 0;border-bottom:1px solid rgb(var(--line));font-weight:700;text-transform:uppercase;font-size:.9rem}
    .menu-cat small{color:rgb(var(--muted))}
    .toast{position:fixed;left:50%;bottom:5.5rem;z-index:35;transform:translate(-50%,1rem);opacity:0;background:rgb(var(--ink));color:#fff;padding:.6rem 1rem;border-radius:.8rem;font-weight:700;font-size:.9rem;transition:.25s;pointer-events:none}
    .toast.mostrar{opacity:1;transform:translate(-50%,0)}
    .demo-faixa{background:rgb(var(--ink));color:#fff;font-size:.8rem;text-align:center;padding:.5rem 1rem}
    .demo-faixa a{color:rgb(var(--blush));font-weight:700}
    .unidade{font-weight:600;font-size:.75rem;color:rgb(var(--muted))}
    .rot-qtd{position:absolute;left:0;right:0;top:-1.15rem;text-align:center;font-size:.65rem;font-weight:800;color:rgb(var(--muted));text-transform:uppercase;letter-spacing:.06em}
    .folha-pe:has(.rot-qtd){padding-top:1.5rem}
    .carregando{position:fixed;inset:0;z-index:70;display:grid;place-content:center;justify-items:center;gap:.4rem;text-align:center;padding:2rem;background:rgb(var(--bg))}
    .carregando[hidden]{display:none}
    .carregando p{margin:0;font-weight:800;font-family:var(--display);font-size:1.2rem}
    .carregando .sub{font-family:inherit;font-weight:500;font-size:.95rem;color:rgb(var(--muted));max-width:22rem}
    .carregando .voltar{margin-top:1rem;font-weight:700;color:rgb(var(--brand))}
    .carregando .voltar[hidden]{display:none}
    .giro{width:2.4rem;height:2.4rem;border-radius:50%;border:4px solid rgb(var(--line));border-top-color:rgb(var(--brand));animation:girar .8s linear infinite;margin-bottom:.6rem}
    .carregando.erro .giro{display:none}
    @keyframes girar{to{transform:rotate(360deg)}}
    .demo-faixa .trocar{display:inline-flex;gap:.4rem;margin-left:.4rem;flex-wrap:wrap;justify-content:center}
    .demo-faixa .trocar a{color:#fff;opacity:.75;text-decoration:none;border:1px solid rgb(255 255 255/.3);border-radius:99px;padding:.05rem .55rem}
    .demo-faixa .trocar a[aria-current="true"]{opacity:1;background:rgb(255 255 255/.15)}
    @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="demo-faixa" data-slot="demo-faixa" hidden></div>
  <div class="carregando" data-slot="carregando" role="status">
    <div class="giro" aria-hidden="true"></div>
    <p data-slot="carregando-titulo">Carregando…</p>
    <p class="sub" data-slot="carregando-texto"></p>
    <a href="index.html" class="voltar" data-slot="carregando-voltar" hidden>Ir para o início</a>
  </div>

  <div class="pagina">
    <header>
      <div class="capa" aria-hidden="true">
        <div class="capa-texto" data-slot="capa-texto"></div>
      </div>
      <div class="status" data-slot="status" role="status"><b data-slot="status-titulo">…</b><span data-slot="status-detalhe"></span></div>
      <div class="logo" data-slot="logo" aria-hidden="true"></div>
      <div class="identidade">
        <h1 data-slot="nome"></h1>
        <p class="endereco"><svg class="i" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12s-8-7-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span data-slot="endereco"></span></p>
        <button type="button" class="btn-info" data-acao="info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Informação</button>
      </div>
    </header>

    <nav class="barra" data-slot="barra" aria-label="Categorias">
      <div class="barra-linha">
        <button type="button" class="icone-btn" data-acao="busca" aria-label="Buscar produto" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button type="button" class="icone-btn" data-acao="menu" aria-label="Ver todas as categorias"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="abas" data-slot="abas"></div>
      </div>
      <label class="busca" data-slot="busca">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="sr-only">Buscar produto</span>
        <input type="search" placeholder="Buscar produto" data-slot="busca-campo" autocomplete="off">
        <button type="button" data-acao="limpar-busca" aria-label="Limpar busca"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </label>
    </nav>

    <main data-slot="lista"></main>

    <footer class="rodape">
      <p>Pedido enviado direto para o WhatsApp da loja. Nada fica salvo neste site.</p>
      <p>Feito com <a href="index.html">MinhaAgenda</a></p>
    </footer>
  </div>

  <div class="sacola-barra" data-slot="sacola-barra">
    <button type="button" data-acao="sacola"><span class="contador" data-slot="sacola-qtd">0</span><span data-slot="sacola-rotulo">Ver carrinho</span><span data-slot="sacola-total">R$ 0,00</span></button>
  </div>

  <div class="fundo" data-slot="fundo"></div>
  <section class="folha" data-slot="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo" hidden>
    <div class="folha-topo"><h3 id="folha-titulo" data-slot="folha-titulo"></h3><button type="button" class="fechar" data-acao="fechar" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="folha-corpo" data-slot="folha-corpo"></div>
    <div class="folha-pe" data-slot="folha-pe"></div>
  </section>

  <div class="toast" data-slot="toast" role="status" aria-live="polite"></div>

  <script src="supabase.js"></script>
  <script src="config.js"></script>
  <script src="comum.js"></script>
  <script src="nichos.js"></script>
  <script src="loja.js"></script>
  <script src="catalogo.js"></script>
</body>
</html>
