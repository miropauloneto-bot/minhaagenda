<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Minha agenda</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6d28d9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/tailwind-tema.js"></script>
  <link rel="stylesheet" href="../assets/base.css">
</head>
<body class="bg-page text-ink min-h-screen">

  <!-- Carregando -->
  <div id="v-carregando" class="min-h-screen flex items-center justify-center">
    <div class="w-10 h-10 rounded-full border-4 border-line border-t-brand animate-spin"></div>
  </div>

  <!-- Login / cadastro / onboarding (preenchidos pelo painel.js) -->
  <div id="v-auth" class="hidden min-h-screen flex items-center justify-center p-4"></div>

  <!-- Painel -->
  <div id="v-app" class="hidden">
    <header class="sticky top-0 z-40 bg-surface/95 backdrop-blur border-b border-line">
      <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
        <div class="min-w-0 flex items-center gap-2">
          <span class="text-xl" data-slot="emoji"></span>
          <p class="font-semibold truncate" data-slot="nome-negocio"></p>
        </div>
        <div class="flex items-center gap-1">
          <a data-slot="link-publico" target="_blank" rel="noopener" class="btn btn-ghost btn-sm"><i data-lucide="external-link" class="w-4 h-4"></i><span class="hidden sm:inline">Minha página</span></a>
          <button data-acao="sair" class="btn btn-ghost btn-sm" aria-label="Sair"><i data-lucide="log-out" class="w-4 h-4"></i><span class="hidden sm:inline">Sair</span></button>
        </div>
      </div>
      <nav class="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto no-scrollbar" data-slot="abas"></nav>
    </header>
    <main id="conteudo" class="max-w-6xl mx-auto px-4 py-6 pb-24"></main>
  </div>

  <!-- Janela de formulário reaproveitável -->
  <dialog id="modal" class="p-0 rounded-2xl bg-surface w-[min(94vw,560px)] max-h-[90vh]">
    <form method="dialog" id="modal-form" class="flex flex-col max-h-[90vh]">
      <div class="px-5 py-4 border-b border-line flex items-center justify-between gap-3">
        <p class="font-semibold" data-slot="modal-titulo"></p>
        <button value="cancelar" formnovalidate class="p-1 text-muted" aria-label="Fechar"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-5 grid gap-4 overflow-y-auto" data-slot="modal-corpo"></div>
      <p class="px-5 text-sm text-red-600 hidden" data-slot="modal-erro"></p>
      <div class="px-5 py-4 border-t border-line flex justify-end gap-2">
        <button value="cancelar" formnovalidate class="btn btn-ghost">Cancelar</button>
        <button value="ok" class="btn btn-primary" data-slot="modal-ok">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="../assets/config.js"></script>
  <script src="../assets/nichos.js"></script>
  <script src="../assets/comum.js"></script>
  <script src="../assets/painel.js"></script>
</body>
</html>
